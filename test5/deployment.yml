
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-app-sa
  namespace: default
imagePullSecrets:
- name: acr-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      serviceAccountName: lab-app-sa

      nodeSelector:
        kubernetes.azure.com/agentpool: poolapps

      containers:
      - name: lab-app
        image: acre00.azurecr.io/lab.app:v1
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20

---     
apiVersion: v1
kind: Service
metadata:
  name: lab-app-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: lab-app
  ports:
  - name: http
    port: 80
    targetPort: 3000  